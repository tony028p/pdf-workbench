name: release

# 兩種發布方式(都會先跑完整測試,通過才發布):
#   1. GitHub 網頁:Actions → release → Run workflow,輸入版本號(例如 v0.1.0)
#   2. 命令列:git tag v0.1.0 && git push origin v0.1.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本號,例如 v0.1.0'
        required: true
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check version format
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本號格式應為 vX.Y.Z(例如 v0.1.0),收到:$VERSION"
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::$VERSION 已經發布過了,請換一個版本號"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: pdf-workbench
          path: dist

      - name: Create release
        run: |
          gh release create "$VERSION" dist/pdf-workbench.html dist/pdf-workbench-ocr.html dist/pdf-workbench-ocr-pack.bin \
            --target "$GITHUB_SHA" \
            --title "PDF 工作台 $VERSION" \
            --generate-notes

  # 下載頁:最新版放上 GitHub Pages(比 Releases 的下載伺服器快;需在 Settings → Pages 把 Source 設成 GitHub Actions)
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pdf-workbench
          path: dist
      - name: Build download page
        run: python3 .github/pages/make_index.py "$VERSION" dist site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
