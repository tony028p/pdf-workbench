name: test

on:
  push:
    branches: ['**']        # 只有分支;版本標籤由 release.yml 處理
  pull_request:
  workflow_call:            # release.yml 發布前先呼叫這裡跑完整測試

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          # 用 LibreOffice 實際開啟匯出的 Word 與 Excel 檔(tests/test_docx.py、test_xlsx.py);中文字型讓轉出的 PDF 保有中文字
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui libreoffice-calc-nogui fonts-noto-cjk qpdf

      - name: Build
        run: |
          python build.py            # 精簡版(不含 OCR)
          python build.py --ocr      # 完整版(內嵌文字辨識),同時產生給精簡版載入的 OCR 套件檔

      - name: Test
        run: python -m pytest -v
        env:
          REQUIRE_SOFFICE: '1'      # CI 上不可略過 LibreOffice 測試

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-workbench
          path: |
            dist/pdf-workbench.html
            dist/pdf-workbench-ocr.html
            dist/pdf-workbench-ocr-pack.bin
          if-no-files-found: ignore
